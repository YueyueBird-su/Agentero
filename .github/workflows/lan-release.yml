name: LAN desktop packages

on:
  workflow_dispatch:
  push:
    branches: [codex/lan-ws-relay]
    tags: ['lan-v*']
    paths:
      - '.github/workflows/lan-release.yml'
      - 'scripts/build-lan.mjs'
      - 'scripts/prepare-tessdata.mjs'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: lan-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macos-arm64, os: macos-15, bundles: dmg}
          - {name: macos-x64, os: macos-15-intel, bundles: dmg}
          - {name: linux-x64, os: ubuntu-22.04, bundles: 'deb,appimage'}
          - {name: linux-arm64, os: ubuntu-24.04-arm, bundles: 'deb,appimage'}
          - {name: windows-x64, os: windows-2022, bundles: nsis}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lan-native-ocr-v1-${{ matrix.name }}
          cache-on-failure: true
          # tesseract-rs links native libraries from outside Cargo's target dir.
          # Keep those files with the Rust cache so restored link paths exist.
          cache-directories: |
            ~/.tesseract-rs
            ~/Library/Application Support/tesseract-rs
            ~/AppData/Roaming/tesseract-rs
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Build private desktop installers
        run: pnpm tauri build --config src-tauri/tauri.lan.conf.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: agentero-lan-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  publish:
    name: Publish LAN prerelease
    if: startsWith(github.ref, 'refs/tags/lan-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentero-lan-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          mkdir publish-assets
          find release-assets -type f -exec cp -t publish-assets -- {} +
          cd publish-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Agentero LAN ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: publish-assets/*
          body: |
            Private desktop test builds for macOS, Windows and Linux. Default relay: ws://10.112.112.91:4000.
            macOS/Windows packages have no developer signing or notarization. No updater signatures, CLI or mobile packages are produced.
